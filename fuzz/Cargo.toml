[package]
name = "qubit-redact-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
fluent-uri = "0.4.1"
http = "1.5"
libfuzzer-sys = "0.4"
qubit-redact = { path = "..", default-features = false, features = ["http", "uri"] }
url = "2.5"

[[bin]]
name = "command_inputs"
path = "fuzz_targets/command_inputs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "direct_inputs"
path = "fuzz_targets/direct_inputs.rs"
test = false
doc = false
bench = false
