[package]
name = "qubit-redact-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
http = "1.4"
libfuzzer-sys = "0.4"
qubit-redact = { path = "..", default-features = false, features = ["http"] }

[[bin]]
name = "http_body"
path = "fuzz_targets/http_body.rs"
test = false
doc = false
bench = false

[[bin]]
name = "web_inputs"
path = "fuzz_targets/web_inputs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "command_inputs"
path = "fuzz_targets/command_inputs.rs"
test = false
doc = false
bench = false
