[package]
name = "qubit-redact"
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-redact"
description = "Rule-driven redaction for fields, diagnostics, HTTP data, and Rust domain objects"
homepage = "https://github.com/qubit-ltd/rs-redact"
documentation = "https://docs.rs/qubit-redact"
readme = "README.md"
keywords = ["redact", "mask", "privacy", "logging", "qubit"]
categories = ["development-tools", "value-formatting"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/benches/**",
    "/src/**",
    "/tests/**",
]

[lib]
name = "qubit_redact"
doctest = true

[workspace]
members = ["derive"]
default-members = [".", "derive"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-redact"
homepage = "https://github.com/qubit-ltd/rs-redact"
readme = "README.md"

[features]
default = []
serde = ["dep:serde"]
http = [
    "dep:form_urlencoded",
    "dep:http",
    "dep:serde_json",
    "dep:url",
]

[dependencies]
form_urlencoded = { version = "1.2", optional = true }
http = { version = "1.4", optional = true }
serde = { version = "1", optional = true }
serde_json = { version = "1.0", optional = true }
url = { version = "2.5", optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
proptest = "1.0"
qubit-redact-derive = { path = "derive" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trybuild = "1"

[[bench]]
name = "redaction_policy"
harness = false

[[bench]]
name = "http_diagnostics"
harness = false
required-features = ["http"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
