[package]
name = "qubit-redact"
version = "0.4.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-redact"
description = "Rule-driven redaction for fields, diagnostics, HTTP data, and Rust domain objects"
homepage = "https://github.com/qubit-ltd/rs-redact"
documentation = "https://docs.rs/qubit-redact"
readme = "README.md"
keywords = ["redact", "mask", "privacy", "logging", "qubit"]
categories = ["development-tools", "value-formatting"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/src/**",
    "/doc/**",
    "/tests/**",
    "/benches/**",
]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "qubit_redact"
doctest = true

[features]
default = []
serde = ["dep:serde"]
json = ["dep:serde_json", "dep:qubit-json"]
http = [
    "json",
    "dep:form_urlencoded",
    "dep:http",
    "dep:url",
]
uri = ["dep:fluent-uri"]

[dependencies]
qubit-budget = { version = "0.4", path = "../rs-budget", features = ["json"] }
qubit-json = { version = "0.7", path = "../rs-json", optional = true }
form_urlencoded = { version = "1.2", optional = true }
fluent-uri = { version = "0.4.1", optional = true }
http = { version = "1.5", optional = true }
serde = { version = "1.0", optional = true }
serde_json = { version = "1.0", optional = true }
url = { version = "2.5", optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
indexmap = "2.14"
proptest = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bench]]
name = "redaction_policy"
harness = false

[[bench]]
name = "http_diagnostics"
harness = false
required-features = ["http"]

[[bench]]
name = "uri_diagnostics"
harness = false
required-features = ["uri"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
