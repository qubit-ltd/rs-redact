[package]
name = "qubit-redact"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-sanitize"
description = "Rule-driven redaction for fields, diagnostics, HTTP data, and Rust domain objects"
homepage = "https://github.com/qubit-ltd/rs-sanitize"
documentation = "https://docs.rs/qubit-redact"
readme = "README.md"
keywords = ["redact", "mask", "privacy", "logging", "qubit"]
categories = ["development-tools", "value-formatting"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/src/**",
    "/tests/**",
]

[lib]
name = "qubit_redact"
doctest = true

[workspace]
members = ["derive"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-sanitize"
homepage = "https://github.com/qubit-ltd/rs-sanitize"
readme = "README.md"

[features]
default = []
derive = ["dep:qubit-redact-derive"]
serde = ["dep:serde"]
http = [
    "dep:form_urlencoded",
    "dep:http",
    "dep:serde_json",
    "dep:url",
]

[dependencies]
form_urlencoded = { version = "1.2", optional = true }
http = { version = "1.4", optional = true }
qubit-redact-derive = { version = "0.1.0", path = "derive", optional = true }
serde = { version = "1", optional = true }
serde_json = { version = "1.0", optional = true }
url = { version = "2.5", optional = true }

[dev-dependencies]
proptest = "1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
