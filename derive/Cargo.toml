[package]
name = "qubit-redact-derive"
version = "0.9.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-redact"
homepage = "https://github.com/qubit-ltd/rs-redact"
documentation = "https://docs.rs/qubit-redact-derive"
readme = "README.md"
description = "Derive macros for qubit-redact domain-object formatting"
keywords = ["redact", "mask", "privacy", "derive", "qubit"]
categories = ["development-tools::procedural-macro-helpers"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/src/**",
]

[package.metadata.docs.rs]
all-features = true

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "^3.5"
proc-macro2 = "^1.0"
quote = "^1.0"
syn = { version = "^3.0", features = ["visit-mut"] }

[dev-dependencies]
# Local doctests use the workspace runtime. Omitting a version keeps this
# development-only edge out of published manifests and avoids a publish cycle.
qubit-redact = { path = "..", default-features = false }
