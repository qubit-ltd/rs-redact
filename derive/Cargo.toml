[package]
name = "qubit-redact-derive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Derive macros for qubit-redact domain-object formatting"
publish = true

[lib]
proc-macro = true
test = false

[dependencies]
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["extra-traits", "full"] }

[dev-dependencies]
qubit-redact = { path = "..", version = "0.4", default-features = false, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trybuild = "1"
