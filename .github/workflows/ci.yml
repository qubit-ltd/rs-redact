name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portable-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: wasm32-unknown-unknown
      - name: Prepare local path dependencies
        run: ./.infra/bin/prepare-local-path-dependencies.sh
      - name: Check portable core
        run: cargo check --locked -p qubit-redact --lib --no-default-features --target wasm32-unknown-unknown
  rust-ci:
    permissions:
      contents: read
      pull-requests: write
      pages: write
      id-token: write
    uses: qubit-ltd/rs-infra-ci/.github/workflows/github-ci.yml@main
    with:
      feature-matrix-prefetch: true
